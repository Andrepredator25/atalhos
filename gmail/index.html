<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Gmail</title>
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>
    <form id="go" action="https://mail.google.com/" method="get"></form>

    <script>
        window.addEventListener("load", function () {
            setTimeout(function () {
                document.getElementById("go").submit();
            }, 150);
        });
    </script>
</body>
</html>
